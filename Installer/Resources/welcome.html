<h1>迹 · Trace</h1>
<p class="subtitle">每一次移动，都有迹可循。</p>
<p>安装你的 Mac 数字足迹工具：</p>
<ul>
<li>220 × 44 的桌面悬浮条，显示鼠标移动距离与键盘输入次数。</li>
<li>按键热力图、活跃时刻与中英文词语画像。</li>
<li>清淡黄木浅色与深色主题，搭配轻微透明的磨砂悬浮条。</li>
<li>所有统计保存在本机，可暂停、导出与清空。</li>
</ul>
<p>适用于 macOS 13 及以上版本，支持 Apple Silicon 和 Intel Mac。</p>
<p>请先退出正在运行的 Trace，再继续安装。</p>
</body></html>
